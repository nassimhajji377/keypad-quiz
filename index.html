<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nassim | Social Links</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="profile">
    <div class="avatar">N</div>

    <h1>Nassim <span class="verified">✓</span></h1>
    <p class="username">@yourusername</p>
    <p class="bio">Welcome to my social links 👋<br>Follow me everywhere!</p>

    <div class="links">
      <!-- Change the URLs and names below -->
      <a class="link-card" href="https://youtube.com/" target="_blank" rel="noopener">
        <span class="icon youtube">▶</span>
        <span>YouTube</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-card" href="https://www.tiktok.com/" target="_blank" rel="noopener">
        <span class="icon tiktok">♪</span>
        <span>TikTok</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-card" href="https://www.instagram.com/" target="_blank" rel="noopener">
        <span class="icon instagram">◎</span>
        <span>Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-card" href="https://discord.com/" target="_blank" rel="noopener">
        <span class="icon discord">◌</span>
        <span>Discord</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-card" href="https://github.com/" target="_blank" rel="noopener">
        <span class="icon github">●</span>
        <span>GitHub</span>
        <span class="arrow">↗</span>
      </a>
    </div>

    <footer>© 2026 Nassim · All rights reserved.</footer>
  </main>
</body>
</html>
