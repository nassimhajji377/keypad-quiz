<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللغز الأول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- زر فتح اللغز -->
    <a
        class="puzzle-link"
        href="https://example.com"
        target="_blank"
        rel="noopener noreferrer"
    >
        📖 فتح اللغز
    </a>

    <main class="game">

        <div class="keypad">

            <h1>🔐 أدخل الرمز</h1>

            <!-- مربعات الرقم -->
            <div class="code-boxes">
                <div class="code-box" id="box1"></div>
                <div class="code-box" id="box2"></div>
                <div class="code-box" id="box3"></div>
            </div>

            <!-- لوحة الأرقام للهاتف -->
            <div class="number-pad">

                <button onclick="pressKey('1')">1</button>
                <button onclick="pressKey('2')">2</button>
                <button onclick="pressKey('3')">3</button>

                <button onclick="pressKey('4')">4</button>
                <button onclick="pressKey('5')">5</button>
                <button onclick="pressKey('6')">6</button>

                <button onclick="pressKey('7')">7</button>
                <button onclick="pressKey('8')">8</button>
                <button onclick="pressKey('9')">9</button>

                <button class="clear" onclick="clearCode()">⌫</button>
                <button onclick="pressKey('0')">0</button>
                <button class="enter" onclick="checkCode()">✓</button>

            </div>

            <p id="message"></p>

        </div>

    </main>

    <script>
        let code = "";
        const correctCode = "241";

        // عند الضغط على أرقام لوحة الهاتف
        function pressKey(number) {

            if (code.length < 3) {
                code += number;
                updateBoxes();
            }

            if (code.length === 3) {
                checkCode();
            }
        }

        // تحديث المربعات
        function updateBoxes() {

            document.getElementById("box1").textContent = code[0] || "";
            document.getElementById("box2").textContent = code[1] || "";
            document.getElementById("box3").textContent = code[2] || "";
        }

        // حذف آخر رقم
        function clearCode() {

            code = code.slice(0, -1);

            updateBoxes();

            document.getElementById("message").textContent = "";
        }

        // التحقق من الرمز
        function checkCode() {

            const message = document.getElementById("message");

            if (code === correctCode) {

                message.textContent = "✅ الرمز صحيح!";
                message.className = "success";

            } else if (code.length === 3) {

                message.textContent = "❌ الرمز خاطئ!";
                message.className = "error";

                setTimeout(() => {

                    code = "";
                    updateBoxes();
                    message.textContent = "";

                }, 1000);
            }
        }

        // كيبورد الكمبيوتر
        document.addEventListener("keydown", function(event) {

            if (/^[0-9]$/.test(event.key)) {
                pressKey(event.key);
            }

            if (event.key === "Backspace") {
                clearCode();
            }

            if (event.key === "Enter") {
                checkCode();
            }

            if (event.key === "Escape") {
                code = "";
                updateBoxes();
                document.getElementById("message").textContent = "";
            }

        });
    </script>

</body>
</html>
