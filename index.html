<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللغز الأول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- زر فتح اللغز -->
    <a
        class="puzzle-link"
        href="https://1drv.ms/w/c/6f9d740353fcf017/IQB0Bhgf3OF_Tp67OiBxKCyvAYrgm_EbGKasy3Ml0vCAZUI?e=LIem6H"
        target="_blank"
        rel="noopener noreferrer"
    >
        📖 فتح اللغز
    </a>

    <main class="game">

        <div class="keypad">

            <h1>🔐 أدخل الرمز</h1>

            <!-- مربعات الرقم -->
            <div class="code-boxes">
                <div class="code-box" id="box1"></div>
                <div class="code-box" id="box2"></div>
                <div class="code-box" id="box3"></div>
            </div>

            <p id="message"></p>

        </div>

    </main>

    <script>
        let code = "";
        const correctCode = "142";

        document.addEventListener("keydown", function(event) {

            // السماح بالأرقام فقط
            if (/^[0-9]$/.test(event.key)) {

                if (code.length < 3) {
                    code += event.key;
                    updateBoxes();
                }

                // فحص الرمز بعد كتابة 3 أرقام
                if (code.length === 3) {
                    checkCode();
                }
            }

            // زر Backspace لحذف آخر رقم
            if (event.key === "Backspace") {
                code = code.slice(0, -1);
                updateBoxes();
                document.getElementById("message").textContent = "";
            }

            // زر Escape لمسح الرقم بالكامل
            if (event.key === "Escape") {
                code = "";
                updateBoxes();
                document.getElementById("message").textContent = "";
            }
        });

        function updateBoxes() {

            document.getElementById("box1").textContent = code[0] || "";
            document.getElementById("box2").textContent = code[1] || "";
            document.getElementById("box3").textContent = code[2] || "";
        }

        function checkCode() {

            const message = document.getElementById("message");

            if (code === correctCode) {

                message.textContent = "✅ الرمز صحيح!";
                message.className = "success";

            } else {

                message.textContent = "❌ الرمز خاطئ!";
                message.className = "error";

                setTimeout(() => {
                    code = "";
                    updateBoxes();
                    message.textContent = "";
                }, 1000);
            }
        }
    </script>

</body>
</html>
