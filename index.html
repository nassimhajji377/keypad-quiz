<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللغز الأول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- زر فتح اللغز -->
    <a
        class="puzzle-link"
        href="https://1drv.ms/w/c/6f9d740353fcf017/IQBNKvzrElA8QqiRdJKUZk8oATNtF5weZcZDwn2XazkfvcU?e=KiZip9"
        target="_blank"
        rel="noopener noreferrer"
    >
        📖 فتح اللغز
    </a>

    <main class="game">

        <div class="stage-viewport">

            <div class="stages" id="stages">

                <!-- المرحلة الأولى -->
                <section class="keypad" id="stage1" data-code="142">

                    <h1>🔐 أدخل الرمز</h1>

                    <input
                        class="codeInput"
                        type="tel"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="3"
                        autocomplete="off"
                        aria-label="أدخل الرمز"
                    >

                    <div class="code-boxes">
                        <div class="code-box"></div>
                        <div class="code-box"></div>
                        <div class="code-box"></div>
                    </div>

                    <p class="message"></p>

                    <button class="next-btn" type="button">التالي ◀</button>

                </section>

                <!-- المرحلة الثانية -->
                <section class="keypad" id="stage2" data-code="598">

                    <h1>🔐 أدخل الرمز</h1>

                    <input
                        class="codeInput"
                        type="tel"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="3"
                        autocomplete="off"
                        aria-label="أدخل الرمز"
                    >

                    <div class="code-boxes">
                        <div class="code-box"></div>
                        <div class="code-box"></div>
                        <div class="code-box"></div>
                    </div>

                    <p class="message"></p>

                </section>

            </div>

        </div>

    </main>

    <script>

        const stagesEl = document.getElementById("stages");

        // تجهيز كل مرحلة (بحث عن عناصرها وربط الأحداث)
        function setupStage(stageEl) {

            const correctCode = stageEl.dataset.code;

            const input = stageEl.querySelector(".codeInput");
            const boxes = stageEl.querySelectorAll(".code-box");
            const message = stageEl.querySelector(".message");
            const nextBtn = stageEl.querySelector(".next-btn");

            // فتح كيبورد الهاتف عند الضغط على المربعات
            stageEl.querySelector(".code-boxes").addEventListener("click", function () {
                input.focus();
            });

            input.addEventListener("input", function () {

                // أرقام فقط
                input.value = input.value.replace(/\D/g, "");

                const code = input.value;

                boxes.forEach(function (box, i) {
                    box.textContent = code[i] || "";
                });

                message.textContent = "";
                message.className = "message";

                if (code.length === 3) {
                    checkCode(code);
                }
            });

            function checkCode(code) {

                if (code === correctCode) {

                    message.textContent = "✅ الرمز صحيح!";
                    message.className = "message success";

                    // إظهار زر التالي إذا كانت هذه المرحلة تحتوي عليه
                    if (nextBtn) {
                        nextBtn.classList.add("show");
                    }

                } else {

                    message.textContent = "❌ الرمز خاطئ!";
                    message.className = "message error";

                    setTimeout(function () {

                        input.value = "";
                        boxes.forEach(function (box) {
                            box.textContent = "";
                        });
                        message.textContent = "";
                        message.className = "message";

                    }, 1000);
                }
            }

            // زر الانتقال للمرحلة التالية (transition push)
            if (nextBtn) {
                nextBtn.addEventListener("click", function () {
                    stagesEl.classList.add("stage2");

                    // تركيز حقل المرحلة الثانية بعد انتهاء الحركة
                    setTimeout(function () {
                        const nextStage = document.getElementById("stage2");
                        const nextInput = nextStage.querySelector(".codeInput");
                        nextInput.focus();
                    }, 500);
                });
            }
        }

        document.querySelectorAll(".keypad").forEach(setupStage);

    </script>

</body>
</html>
