<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللغز الأول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- زر فتح اللغز -->
    <a
        class="puzzle-link"
        href="https://example.com"
        target="_blank"
        rel="noopener noreferrer"
    >
        📖 فتح اللغز
    </a>

    <main class="game">

        <div class="keypad">

            <h1>🔐 أدخل الرمز</h1>

            <!-- حقل مخفي يفتح كيبورد الهاتف -->
            <input
                id="codeInput"
                type="tel"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="3"
                autocomplete="off"
                aria-label="أدخل الرمز"
            >

            <!-- مربعات الرمز -->
            <div class="code-boxes" onclick="focusInput()">

                <div class="code-box" id="box1"></div>
                <div class="code-box" id="box2"></div>
                <div class="code-box" id="box3"></div>

            </div>

            <p id="message"></p>

        </div>

    </main>

    <script>

        const input = document.getElementById("codeInput");

        const box1 = document.getElementById("box1");
        const box2 = document.getElementById("box2");
        const box3 = document.getElementById("box3");

        const message = document.getElementById("message");

        const correctCode = "241";

        // فتح كيبورد الهاتف
        function focusInput() {
            input.focus();
        }

        // عند كتابة الرقم
        input.addEventListener("input", function () {

            // أرقام فقط
            input.value = input.value.replace(/\D/g, "");

            const code = input.value;

            // وضع الأرقام داخل المربعات
            box1.textContent = code[0] || "";
            box2.textContent = code[1] || "";
            box3.textContent = code[2] || "";

            message.textContent = "";
            message.className = "";

            // عندما يكتب 3 أرقام
            if (code.length === 3) {
                checkCode(code);
            }
        });

        // فحص الرمز
        function checkCode(code) {

            if (code === correctCode) {

                message.textContent = "✅ الرمز صحيح!";
                message.className = "success";

            } else {

                message.textContent = "❌ الرمز خاطئ!";
                message.className = "error";

                setTimeout(function () {

                    input.value = "";

                    box1.textContent = "";
                    box2.textContent = "";
                    box3.textContent = "";

                    message.textContent = "";

                }, 1000);
            }
        }

    </script>

</body>
</html>
